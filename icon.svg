<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b7cf6"/>
      <stop offset="1" stop-color="#f472b6"/>
    </linearGradient>
  </defs>
  <rect width="512" height="512" rx="112" fill="#16131f"/>
  <rect x="36" y="36" width="440" height="440" rx="92" fill="url(#bg)"/>
  <!-- pixel checklist card -->
  <g shape-rendering="crispEdges">
    <rect x="150" y="140" width="212" height="232" rx="18" fill="#fff1b8"/>
    <rect x="150" y="140" width="212" height="44" rx="18" fill="#ff9ec4"/>
    <rect x="150" y="166" width="212" height="20" fill="#ff9ec4"/>
    <!-- check rows -->
    <rect x="176" y="212" width="34" height="34" rx="8" fill="#8fd9bd"/>
    <rect x="224" y="222" width="118" height="14" rx="7" fill="#c4a7f0"/>
    <rect x="176" y="266" width="34" height="34" rx="8" fill="#8fd9bd"/>
    <rect x="224" y="276" width="118" height="14" rx="7" fill="#c4a7f0"/>
    <rect x="176" y="320" width="34" height="34" rx="8" fill="#a0c4ff"/>
    <rect x="224" y="330" width="118" height="14" rx="7" fill="#a0c4ff"/>
    <!-- checkmarks -->
    <path d="M182 229 l7 8 l14 -16" stroke="#2a2440" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M182 283 l7 8 l14 -16" stroke="#2a2440" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <!-- little sparkle -->
  <g fill="#fff6d8">
    <rect x="384" y="120" width="16" height="16"/>
    <rect x="376" y="128" width="8" height="8" opacity="0.7"/>
    <rect x="400" y="128" width="8" height="8" opacity="0.7"/>
