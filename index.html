  { id:'event',    key:'type_event',    color:'#c4a7f0', payable:false },
];
const REPEATS = [
  { id:'none',  key:'rep_none' },
  { id:'week',  key:'rep_week' },
  { id:'month', key:'rep_month' },
  { id:'year',  key:'rep_year' },
];
function calTypeById(id){ return CAL_TYPES.find(x=>x.id===id) || CAL_TYPES[4]; }

// does an event (with its repeat rule) occur on date d?
function eventOccursOn(ev, d) {
  const start = new Date(ev.date + 'T00:00:00');
  if (isNaN(start)) return false;
  const day = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const s = new Date(start.getFullYear(), start.getMonth(), start.getDate());
  if (day < s) return false;
  switch (ev.repeat) {
    case 'week':  return ((day - s) / 86400000) % 7 === 0;
    case 'month': return day.getDate() === s.getDate();
    case 'year':  return day.getDate() === s.getDate() && day.getMonth() === s.getMonth();
    default:      return day.getTime() === s.getTime();
  }
}

function buildCalendar(root) {
  let view = new Date(); view.setDate(1);
  root.innerHTML = `
    <div class="cal-head">
      <button class="cal-nav" id="calPrev">‹</button>
      <div class="cal-month" id="calMonth"></div>
      <button class="cal-nav" id="calNext">›</button>
    </div>
    <div class="cal-grid" id="calGridHead"></div>
    <div class="cal-grid" id="calGrid"></div>
    <div class="section-title" id="calUpTitle"></div>
    <div id="calUpcoming"></div>`;

  $('#calPrev', root).addEventListener('click', () => { view.setMonth(view.getMonth()-1); drawMonth(); });
  $('#calNext', root).addEventListener('click', () => { view.setMonth(view.getMonth()+1); drawMonth(); });

  function drawMonth() {
    const months = t('months'), wd = t('weekdays_short');
    $('#calMonth', root).textContent = months[view.getMonth()] + ' ' + view.getFullYear();
    const head = $('#calGridHead', root); head.innerHTML = '';
    wd.forEach(w => { const c=document.createElement('div'); c.className='cal-wd'; c.textContent=w; head.appendChild(c); });

    const grid = $('#calGrid', root); grid.innerHTML = '';
    const first = new Date(view.getFullYear(), view.getMonth(), 1);
    let startDow = (first.getDay() + 6) % 7; // Monday-first
    const daysInMonth = new Date(view.getFullYear(), view.getMonth()+1, 0).getDate();
    const events = store.get('calEvents', []);
    const today = new Date();

    for (let i=0; i<startDow; i++) { const c=document.createElement('div'); c.className='cal-cell empty'; grid.appendChild(c); }
    for (let dnum=1; dnum<=daysInMonth; dnum++) {
      const dateObj = new Date(view.getFullYear(), view.getMonth(), dnum);
      const cell = document.createElement('div');
      cell.className = 'cal-cell';
      const isToday = dateObj.toDateString() === today.toDateString();
      if (isToday) cell.classList.add('today');
      const num = document.createElement('div'); num.className='cal-daynum'; num.textContent = dnum;
      cell.appendChild(num);
      const dots = document.createElement('div'); dots.className='cal-dots';
      const dayEvents = events.filter(ev => eventOccursOn(ev, dateObj));
      [...new Set(dayEvents.map(e=>e.color || calTypeById(e.type).color))].slice(0,4).forEach(colr => {
        const dot=document.createElement('span'); dot.className='cal-dot'; dot.style.background=colr; dots.appendChild(dot);
      });
      cell.appendChild(dots);
      cell.addEventListener('click', () => openDay(dateObj));
      grid.appendChild(cell);
    }
    drawUpcoming();
  }

  function drawUpcoming() {
    $('#calUpTitle', root).textContent = t('cal_upcoming');
    const el = $('#calUpcoming', root);
    const events = store.get('calEvents', []);
    const today = new Date(); today.setHours(0,0,0,0);
    const horizon = new Date(today); horizon.setDate(horizon.getDate()+60);
    const occ = [];
    events.forEach(ev => {
      for (let d=new Date(today); d<=horizon; d.setDate(d.getDate()+1)) {
        if (eventOccursOn(ev, d)) { occ.push({ ev, date:new Date(d) }); break; }
      }
    });
    occ.sort((a,b)=>a.date-b.date);
    if (!occ.length) { el.innerHTML = `<div class="empty">${t('cal_no_upcoming')}</div>`; return; }
    el.innerHTML = '';
    const locale = LANG==='en'?'en-GB':'it-IT';
    occ.slice(0,8).forEach(({ev,date}) => {
      const type = calTypeById(ev.type);
      const div = document.createElement('div'); div.className='list-item';
      const done = ev.done ? 'opacity:0.5;' : '';
      const dstr = date.toLocaleDateString(locale,{weekday:'short',day:'numeric',month:'short'});
      div.innerHTML = `
        <span class="cal-dot" style="background:${type.color};width:14px;height:14px;"></span>
        <div class="grow" style="${done}"><strong>${escapeHtml(ev.title)}</strong><br>
          <span class="muted">${dstr} · ${t(type.key)}${ev.note?' · '+escapeHtml(ev.note):''}${ev.done?' ✓':''}</span></div>`;
      div.querySelector('.grow').addEventListener('click', () => openDay(date));
      el.appendChild(div);
    });
  }

  function openDay(dateObj) {
    const id = 'calday-' + todayKey(dateObj);
    openScreen(id, (body) => dayEditor(body, dateObj, drawMonth),
      () => dateObj.toLocaleDateString(LANG==='en'?'en-GB':'it-IT',{weekday:'long',day:'numeric',month:'long'}),
      'calendar');
  }

  drawMonth();
}

/* =========================================================
   7. NOTES (auto-save + encrypted notes via Web Crypto)
   ========================================================= */
async function deriveKey(password, salt) {
  const enc = new TextEncoder();
  const keyMaterial = await crypto.subtle.importKey('raw', enc.encode(password), 'PBKDF2', false, ['deriveKey']);
  return crypto.subtle.deriveKey(
    { name:'PBKDF2', salt, iterations:150000, hash:'SHA-256' },
    keyMaterial, { name:'AES-GCM', length:256 }, false, ['encrypt','decrypt']
  );
}
function bufToB64(buf){ return btoa(String.fromCharCode(...new Uint8Array(buf))); }
function b64ToBuf(b64){ return Uint8Array.from(atob(b64), c=>c.charCodeAt(0)); }
async function encryptText(text, password) {
  const enc = new TextEncoder();
  const salt = crypto.getRandomValues(new Uint8Array(16));
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const key = await deriveKey(password, salt);
  const cipher = await crypto.subtle.encrypt({name:'AES-GCM', iv}, key, enc.encode(text));
  return { salt:bufToB64(salt), iv:bufToB64(iv), data:bufToB64(cipher) };
}
async function decryptText(payload, password) {
  const key = await deriveKey(password, b64ToBuf(payload.salt));
  const plain = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64ToBuf(payload.iv)}, key, b64ToBuf(payload.data));
  return new TextDecoder().decode(plain);
}

function noteEditor(body, id, refresh) {
  const notes = store.get('notes', []);
  const n = notes.find(x => x.id === id);
  if (!n) { body.innerHTML = `<div class="empty">${t('note_not_found')}</div>`; return; }
  n.locked ? renderLockedFlow() : renderEditor(n.text);

  function closeSelf() {
    const screen = document.getElementById('screen-note-'+id);
    if (screen && screen.classList.contains('open') && history.state && history.state.screen === screen.id) history.back();
    else if (screen) closeScreen(screen);
  }

  function renderEditor(initialText) {
    body.innerHTML = `
      <div class="field"><input id="nTitle" placeholder="${t('title_ph')}" value="${escapeAttr(n.title||'')}" /></div>
      <textarea id="nText" placeholder="${t('note_ph')}" style="min-height:44vh;">${escapeHtml(initialText||'')}</textarea>
      <div class="muted" id="nStatus" style="margin:8px 0;">${t('autosave_on')}</div>
      <button class="btn" id="nSave" style="width:100%;">${t('save_note')}</button>`;
    const title = $('#nTitle', body), text = $('#nText', body), status = $('#nStatus', body);
    let saveTimer;
    async function persist() {
      const list = store.get('notes', []);
      const note = list.find(x=>x.id===id);
      note.title = title.value;
      if (note.locked) note.enc = await encryptText(text.value, note._pw);
      else note.text = text.value;
      store.set('notes', list);
      refresh();
    }
    function scheduleSave() {
      clearTimeout(saveTimer);
      status.textContent = t('typing');
      saveTimer = setTimeout(async () => { await persist(); status.textContent = t('saved'); }, 600);
    }
    title.addEventListener('input', scheduleSave);
    text.addEventListener('input', scheduleSave);
    $('#nSave', body).addEventListener('click', async () => {
      clearTimeout(saveTimer);
      await persist();
      toast(t('saved'));
      closeSelf();
    });
  }

  function renderLockedFlow() {
    if (!n.enc) {
      body.innerHTML = `
        <div class="card">
          <div class="section-title" style="margin-top:0; display:flex; align-items:center; gap:8px;">${pixelIconImg('lock',18)} ${t('set_pw')}</div>
          <div class="muted" style="margin-bottom:10px;">${t('set_pw_desc')}</div>
          <div class="field"><input id="pw1" type="password" placeholder="${t('pw')}" /></div>
          <div class="field"><input id="pw2" type="password" placeholder="${t('pw_repeat')}" /></div>
          <button class="btn" id="pwSet" style="width:100%;">${t('create_locked')}</button>
        </div>`;
      $('#pwSet', body).addEventListener('click', () => {
        const p1=$('#pw1',body).value, p2=$('#pw2',body).value;
        if (p1.length<4) { toast(t('pw_short')); return; }
        if (p1!==p2) { toast(t('pw_mismatch')); return; }
        n._pw = p1; renderEditor('');
      });
    } else {
      body.innerHTML = `
        <div class="card">
          <div class="section-title" style="margin-top:0; display:flex; align-items:center; gap:8px;">${pixelIconImg('lock',18)} ${t('protected_note')}</div>
          <div class="muted" style="margin-bottom:10px;">${t('unlock_desc')}</div>
          <div class="field"><input id="pwIn" type="password" placeholder="${t('pw')}" /></div>
          <button class="btn" id="pwOpen" style="width:100%;">${t('unlock')}</button>
        </div>`;
      $('#pwOpen', body).addEventListener('click', async () => {
        try { const txt = await decryptText(n.enc, $('#pwIn',body).value); n._pw=$('#pwIn',body).value; renderEditor(txt); }
        catch(e) { toast(t('wrong_pw')); }
      });
      $('#pwIn', body).addEventListener('keydown', e => { if(e.key==='Enter') $('#pwOpen',body).click(); });
    }
  }
}

document.addEventListener('click', (e) => {
  const menu = $('#themeMenu');
  if (menu.classList.contains('open') && !e.target.closest('.theme-wrap')) menu.classList.remove('open');
});

// Audio toggle
$('#audioBtn').addEventListener('click', () => {
  const isOn = AUDIO.toggle();
  const btn = $('#audioBtn');
  btn.textContent = isOn ? '🔊' : '🔇';
  btn.classList.toggle('on', isOn);
  btn.setAttribute('aria-pressed', isOn ? 'true' : 'false');
});

$('#appTitle').textContent = t('appTitle');
renderHome();
updateGreeting();
setInterval(updateGreeting, 60000);

window.addEventListener('popstate', () => {
  const open = $$('.screen.open');
  if (open.length) closeScreen(open[open.length-1]);
});

// Register service worker for offline/PWA (skipped on file:// where SW is unsupported)
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').catch(() => {});
  });
}
</script>
</body>
</html>
